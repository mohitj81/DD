    ]
};

    try {
        var params = new URLSearchParams(window.location.search);
        var orbId = params.get('orb') || 'orb-1';
        var photos = ORB_GALLERIES[orbId];
        if (!photos || !photos.length) return;

        var dataTag = document.getElementById('__NEXT_DATA__');
        if (!dataTag) return;

        var data = JSON.parse(dataTag.textContent);
        var images = photos.map(function (p) {
            return {
                image: {
                    dimensions: { width: 3840, height: 2559 },
                    alt: p.alt,
                    copyright: null,
                    url: new URL(p.url, window.location.origin).href,
                    id: p.alt.replace(/\s+/g, '-').toLowerCase() + '-' + Math.random().toString(36).slice(2, 7),
                    edit: { x: 0, y: 0, zoom: 1.875, background: '#fff' }
                }
            };
        });

        data.props.pageProps.cms.gallery.images = images;
        dataTag.textContent = JSON.stringify(data);
    } catch (err) {
        console.warn('Could not override quarry gallery images:', err);
    }
})();
</script>
